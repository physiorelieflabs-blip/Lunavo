name: Lunavo CI

on:
  push:
    branches: [main, feat/social-hub-ui-real, feat/lunavo-master-implementation]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Self-hosted core policy
        run: pnpm run check:self-hosted
      - name: Implementation invariants
        run: node scripts/lunavo-implementation-audit.mjs
      - name: Critical payment and subscription simulation
        run: node --experimental-strip-types scripts/security-simulation.ts
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
