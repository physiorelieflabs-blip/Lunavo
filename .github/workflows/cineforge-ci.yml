name: CineForge CI

on:
  pull_request:
    paths:
      - "CineForge_Unified/**"
      - ".github/workflows/cineforge-ci.yml"
  push:
    branches:
      - main
    paths:
      - "CineForge_Unified/**"
      - ".github/workflows/cineforge-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CineForge_Unified
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q backend
      - run: pytest -q
