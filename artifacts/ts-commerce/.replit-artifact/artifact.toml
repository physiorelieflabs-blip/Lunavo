kind = "web"
previewPath = "/"
title = "TS Commerce"
description = "A multi-tenant commerce operating system for merchants, with TS Pay balances, storefront operations, and a master admin console for subscription and platform revenue control."
version = "1.0.0"
id = "artifacts/ts-commerce"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18358

[services.development]
run = "pnpm --filter @workspace/ts-commerce run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ts-commerce", "run", "build" ]
serve = "static"
publicDir = "artifacts/ts-commerce/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18358"
BASE_PATH = "/"
