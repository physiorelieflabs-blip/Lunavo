# Optional self-hosted model runtime for Lunavo.
# Use with: docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d
# The model weights are downloaded on first boot and stored in the persistent volume.
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.3}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - lunavo_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    # Intentionally do not publish 11434 on the host. It is reachable only
    # on the private Docker network by the Lunavo API and model initializer.

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.3}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      ollama pull qwen2.5:7b
      ollama pull mistral:7b
      ollama pull qwen2.5-coder:7b
      ollama pull qwen2.5vl:3b

  lunavo:
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    environment:
      LUNAVO_LOCAL_LLM_POOL: '[{"id":"primary","url":"http://ollama:11434/v1/chat/completions","model":"qwen2.5:7b","role":"primary","weight":4},{"id":"critic","url":"http://ollama:11434/v1/chat/completions","model":"mistral:7b","role":"critic","weight":3},{"id":"coding","url":"http://ollama:11434/v1/chat/completions","model":"qwen2.5-coder:7b","role":"coding","weight":2},{"id":"vision","url":"http://ollama:11434/v1/chat/completions","model":"qwen2.5vl:3b","role":"vision","weight":2}]'

volumes:
  lunavo_ollama_models:
