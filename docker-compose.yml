services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunavo
      POSTGRES_USER: lunavo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - lunavo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunavo -d lunavo"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ollama pull ${LUNAVO_LOCAL_LLM_MODEL:-qwen3:8b} && ollama pull ${LUNAVO_LOCAL_VISION_MODEL:-qwen3-vl:8b}"]
    volumes:
      - ollama_data:/root/.ollama

  social-gateway:
    build:
      context: ./services/social-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      SOCIAL_GATEWAY_TOKEN: ${SOCIAL_GATEWAY_TOKEN:?set SOCIAL_GATEWAY_TOKEN}
      SOCIAL_META_CLIENT_ID: ${SOCIAL_META_CLIENT_ID:-}
      SOCIAL_META_CLIENT_SECRET: ${SOCIAL_META_CLIENT_SECRET:-}
      SOCIAL_TIKTOK_CLIENT_KEY: ${SOCIAL_TIKTOK_CLIENT_KEY:-}
      SOCIAL_TIKTOK_CLIENT_SECRET: ${SOCIAL_TIKTOK_CLIENT_SECRET:-}
      SOCIAL_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID:-}
      SOCIAL_GOOGLE_CLIENT_SECRET: ${SOCIAL_GOOGLE_CLIENT_SECRET:-}
      SOCIAL_LINKEDIN_CLIENT_ID: ${SOCIAL_LINKEDIN_CLIENT_ID:-}
      SOCIAL_LINKEDIN_CLIENT_SECRET: ${SOCIAL_LINKEDIN_CLIENT_SECRET:-}
      SOCIAL_LINKEDIN_API_VERSION: ${SOCIAL_LINKEDIN_API_VERSION:-}
      SOCIAL_PINTEREST_CLIENT_ID: ${SOCIAL_PINTEREST_CLIENT_ID:-}
      SOCIAL_PINTEREST_CLIENT_SECRET: ${SOCIAL_PINTEREST_CLIENT_SECRET:-}
      SOCIAL_X_CLIENT_ID: ${SOCIAL_X_CLIENT_ID:-}
      SOCIAL_X_CLIENT_SECRET: ${SOCIAL_X_CLIENT_SECRET:-}

  lunavo:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
      social-gateway:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      DATABASE_URL: postgres://lunavo:${POSTGRES_PASSWORD}@postgres:5432/lunavo
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      LUNAVO_SOCIAL_GATEWAY_URL: ${LUNAVO_SOCIAL_GATEWAY_URL:-http://social-gateway:8080}
      LUNAVO_SOCIAL_GATEWAY_TOKEN: ${SOCIAL_GATEWAY_TOKEN:-}
      LUNAVO_LOCAL_LLM_URL: ${LUNAVO_LOCAL_LLM_URL:-http://ollama:11434/v1/chat/completions}
      LUNAVO_LOCAL_LLM_MODEL: ${LUNAVO_LOCAL_LLM_MODEL:-qwen3:8b}
      LUNAVO_LOCAL_VISION_MODEL: ${LUNAVO_LOCAL_VISION_MODEL:-qwen3-vl:8b}
      LUNAVO_LOCAL_IMAGE_URL: ${LUNAVO_LOCAL_IMAGE_URL:-}
      LUNAVO_LOCAL_IMAGE_MODEL: ${LUNAVO_LOCAL_IMAGE_MODEL:-local-image}
      LUNAVO_LOCAL_EMBEDDINGS_URL: ${LUNAVO_LOCAL_EMBEDDINGS_URL:-}
      LUNAVO_LOCAL_SEARCH_URL: ${LUNAVO_LOCAL_SEARCH_URL:-}
      LUNAVO_LOCAL_OBJECT_STORAGE_PATH: /data/lunavo
      LUNAVO_LOCAL_MAIL_FROM: ${LUNAVO_LOCAL_MAIL_FROM:-no-reply@lunavo.local}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET:-}
    ports:
      - "${LUNAVO_PORT:-5000}:5000"
    volumes:
      - lunavo_data:/data/lunavo

volumes:
  lunavo_postgres:
  lunavo_data:
  ollama_data:
