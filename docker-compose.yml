services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunavo
      POSTGRES_USER: lunavo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - lunavo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunavo -d lunavo"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -eu
        ready=0
        for attempt in $(seq 1 60); do
          if ollama list >/dev/null 2>&1; then ready=1; break; fi
          sleep 2
        done
        if [ "$ready" -ne 1 ]; then
          echo "Ollama did not become ready; local AI model initialization skipped." >&2
          exit 1
        fi
        for model in $(printf "%s" "${LUNAVO_LOCAL_MODEL_PACK:-qwen3:4b,qwen3:14b,deepseek-r1:14b,gemma3:12b,nomic-embed-text}" | tr ',' ' '); do
          echo "Pulling $model"
          if ! ollama pull "$model"; then
            echo "Failed to pull local model $model; core Lunavo remains available with AI degraded." >&2
            exit 1
          fi
        done
    volumes:
      - ollama_data:/root/.ollama

  social-gateway:
    build:
      context: ./services/social-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      SOCIAL_GATEWAY_TOKEN: ${SOCIAL_GATEWAY_TOKEN:?set SOCIAL_GATEWAY_TOKEN}
      SOCIAL_META_CLIENT_ID: ${SOCIAL_META_CLIENT_ID:-}
      SOCIAL_META_CLIENT_SECRET: ${SOCIAL_META_CLIENT_SECRET:-}
      SOCIAL_TIKTOK_CLIENT_KEY: ${SOCIAL_TIKTOK_CLIENT_KEY:-}
      SOCIAL_TIKTOK_CLIENT_SECRET: ${SOCIAL_TIKTOK_CLIENT_SECRET:-}
      SOCIAL_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID:-}
      SOCIAL_GOOGLE_CLIENT_SECRET: ${SOCIAL_GOOGLE_CLIENT_SECRET:-}
      SOCIAL_LINKEDIN_CLIENT_ID: ${SOCIAL_LINKEDIN_CLIENT_ID:-}
      SOCIAL_LINKEDIN_CLIENT_SECRET: ${SOCIAL_LINKEDIN_CLIENT_SECRET:-}
      SOCIAL_LINKEDIN_API_VERSION: ${SOCIAL_LINKEDIN_API_VERSION:-}
      SOCIAL_PINTEREST_CLIENT_ID: ${SOCIAL_PINTEREST_CLIENT_ID:-}
      SOCIAL_PINTEREST_CLIENT_SECRET: ${SOCIAL_PINTEREST_CLIENT_SECRET:-}
      SOCIAL_X_CLIENT_ID: ${SOCIAL_X_CLIENT_ID:-}
      SOCIAL_X_CLIENT_SECRET: ${SOCIAL_X_CLIENT_SECRET:-}

  fx-gateway:
    build:
      context: ./services/fx-gateway
    restart: unless-stopped
    environment:
      PORT: 8081
      FX_RATES_FILE: /data/lunavo/fx-rates.json
    volumes:
      - lunavo_data:/data/lunavo
    expose:
      - "8081"

  lunavo:
    build: .
    restart: unless-stopped
    depends_on:
      fx-gateway:
        condition: service_started
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      social-gateway:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      DATABASE_URL: postgres://lunavo:${POSTGRES_PASSWORD}@postgres:5432/lunavo
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      LUNAVO_SOCIAL_GATEWAY_URL: ${LUNAVO_SOCIAL_GATEWAY_URL:-http://social-gateway:8080}
      LUNAVO_SOCIAL_GATEWAY_TOKEN: ${SOCIAL_GATEWAY_TOKEN:-}
      LUNAVO_LOCAL_LLM_URL: ${LUNAVO_LOCAL_LLM_URL:-http://ollama:11434/v1/chat/completions}
      LUNAVO_LOCAL_LLM_MODEL: ${LUNAVO_LOCAL_LLM_MODEL:-qwen3:14b}
      LUNAVO_LOCAL_AI_FAST_MODEL: ${LUNAVO_LOCAL_AI_FAST_MODEL:-qwen3:4b}
      LUNAVO_LOCAL_AI_GENERAL_MODEL: ${LUNAVO_LOCAL_AI_GENERAL_MODEL:-qwen3:14b}
      LUNAVO_LOCAL_AI_MAX_PARALLEL: ${LUNAVO_LOCAL_AI_MAX_PARALLEL:-2}
      LUNAVO_LOCAL_AI_REASONING_MODEL: ${LUNAVO_LOCAL_AI_REASONING_MODEL:-deepseek-r1:14b}
      LUNAVO_LOCAL_AI_CODING_MODEL: ${LUNAVO_LOCAL_AI_CODING_MODEL:-qwen3:14b}
      LUNAVO_LOCAL_AI_VISION_MODEL: ${LUNAVO_LOCAL_AI_VISION_MODEL:-gemma3:12b}
      LUNAVO_LOCAL_AI_REVIEW_MODEL: ${LUNAVO_LOCAL_AI_REVIEW_MODEL:-gemma3:12b}
      LUNAVO_LOCAL_VISION_MODEL: ${LUNAVO_LOCAL_VISION_MODEL:-gemma3:12b}
      LUNAVO_LOCAL_MODEL_PACK: ${LUNAVO_LOCAL_MODEL_PACK:-qwen3:4b,qwen3:14b,deepseek-r1:14b,gemma3:12b,nomic-embed-text}
      LUNAVO_LOCAL_IMAGE_URL: ${LUNAVO_LOCAL_IMAGE_URL:-}
      LUNAVO_LOCAL_IMAGE_MODEL: ${LUNAVO_LOCAL_IMAGE_MODEL:-local-image}
      LUNAVO_LOCAL_EMBEDDINGS_URL: ${LUNAVO_LOCAL_EMBEDDINGS_URL:-http://ollama:11434/v1/embeddings}
      LUNAVO_LOCAL_FX_URL: ${LUNAVO_LOCAL_FX_URL:-http://fx-gateway:8081/v1/rate}
      FX_RATES_FILE: /data/lunavo/fx-rates.json
      LUNAVO_LOCAL_OBJECT_STORAGE_PATH: /data/lunavo
      LUNAVO_LOCAL_MAIL_FROM: ${LUNAVO_LOCAL_MAIL_FROM:-no-reply@lunavo.local}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET:-}
    ports:
      - "${LUNAVO_PORT:-5000}:5000"
    volumes:
      - lunavo_data:/data/lunavo


  master-admin-bootstrap:
    build: .
    profiles: ["bootstrap"]
    restart: "no"
    depends_on:
      lunavo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://lunavo:${POSTGRES_PASSWORD}@postgres:5432/lunavo
      LUNAVO_MASTER_ADMIN_EMAIL: ${LUNAVO_MASTER_ADMIN_EMAIL:-}
      LUNAVO_MASTER_ADMIN_USERNAME: ${LUNAVO_MASTER_ADMIN_USERNAME:-tsadmin}
      LUNAVO_MASTER_ADMIN_PASSWORD: ${LUNAVO_MASTER_ADMIN_PASSWORD:-}
    command: ["node", "--experimental-strip-types", "artifacts/api-server/src/bootstrap-master-admin.ts"]

volumes:
  lunavo_postgres:
  lunavo_data:
  ollama_data:
