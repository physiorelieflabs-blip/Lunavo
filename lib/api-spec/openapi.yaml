      summary: Approve and post a refund reversal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Approved refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundRecord" }
  /reconciliation:
    post:
      operationId: createReconciliation
      tags: [payments]
      summary: Record a reconciliation discrepancy without rewriting ledger history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationInput" }
      responses:
        "201":
          description: Reconciliation record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRecord" }
    get:
      operationId: listReconciliations
      tags: [payments]
      summary: List reconciliation records
      responses:
        "200":
          description: Reconciliation records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReconciliationRecord" }
  /reconciliation/{id}:
    patch:
      operationId: updateReconciliation
      tags: [payments]
      summary: Update reconciliation workflow status without changing ledger history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationUpdateInput" }
      responses:
        "200":
          description: Updated reconciliation record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRecord" }
  /inventory/reservations:
    get:
      operationId: listInventoryReservations
      tags: [inventory]
      summary: List tenant-scoped inventory reservations
      responses:
        "200":
          description: Inventory reservations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryReservation" }
  /inventory/movements:
    get:
      operationId: listInventoryMovements
      tags: [inventory]
      summary: List immutable tenant-scoped inventory movements
      responses:
        "200":
          description: Inventory movement history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryMovement" }
  /inventory/adjustments:
    post:
      operationId: createInventoryAdjustment
      tags: [inventory]
      summary: Apply an idempotent manual stock adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryAdjustmentInput" }
      responses:
        "201":
          description: Stock adjustment movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryMovement" }
  /events:
    get:
      operationId: listDomainEvents
      tags: [dashboard]
      summary: List tenant-scoped domain event history
      parameters:
        - name: aggregateType
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: aggregateId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: correlationId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Merchant event history
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DomainEventRecord" } } } }
  /events/{id}/replay:
    post:
      operationId: replayDomainEvent
      tags: [dashboard]
      summary: Replay failed event projections only
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Event queued for projection replay
          content: { application/json: { schema: { $ref: "#/components/schemas/DomainEventRecord" } } }
  /notifications:
    get:
      operationId: listNotifications
      tags: [dashboard]
      summary: List merchant notifications
      responses:
        "200":
          description: Merchant notifications
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/NotificationRecord" } } } }
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [dashboard]
      summary: Mark a merchant notification read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated notification
          content: { application/json: { schema: { $ref: "#/components/schemas/NotificationRecord" } } }
  /team/access:
    get:
      operationId: getTeamAccess
      tags: [team]
      responses: {"200": {description: Access, content: {application/json: {schema: {$ref: "#/components/schemas/TeamAccess"}}}}}
  /workspaces:
    get:
      operationId: listAccessibleWorkspaces
      tags: [team]
      responses: {"200": {description: Active workspaces, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Workspace"}}}}}}
  /workspaces/current:
    get:
      operationId: getCurrentWorkspace
      tags: [team]
      parameters: [{name: X-TS-Commerce-Workspace-Id, in: header, required: false, schema: {type: integer}}]
      responses: {"200": {description: Current workspace, content: {application/json: {schema: {$ref: "#/components/schemas/Workspace"}}}}}
  /team/locations:
    get:
      operationId: listTeamLocations
      tags: [team]
      responses: {"200": {description: Locations, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/TeamLocation"}}}}}}
    post:
      operationId: createTeamLocation
      tags: [team]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TeamLocationInput"}}}}
      responses: {"201": {description: Location, content: {application/json: {schema: {$ref: "#/components/schemas/TeamLocation"}}}}}
  /team/locations/{id}:
    patch:
      operationId: updateTeamLocation
      tags: [team]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TeamLocationUpdate"}}}}
      responses: {"200": {description: Location, content: {application/json: {schema: {$ref: "#/components/schemas/TeamLocation"}}}}}
  /team/locations/{id}/disable:
    post:
      operationId: disableTeamLocation
      tags: [team]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Location, content: {application/json: {schema: {$ref: "#/components/schemas/TeamLocation"}}}}}
  /team/locations/{id}/default:
    post:
      operationId: setDefaultTeamLocation
      tags: [team]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Location, content: {application/json: {schema: {$ref: "#/components/schemas/TeamLocation"}}}}}
  /team/roles:
    get:
      operationId: listTeamRoles
      tags: [team]
      responses: {"200": {description: Roles, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/TeamRole"}}}}}}
  /team/memberships:
    get:
      operationId: listTeamMemberships
      tags: [team]
      responses: {"200": {description: Memberships, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/TeamMembership"}}}}}}
  /team/memberships/{id}:
    patch:
      operationId: updateTeamMembership
      tags: [team]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TeamMembershipUpdate"}}}}
      responses: {"200": {description: Membership, content: {application/json: {schema: {$ref: "#/components/schemas/TeamMembership"}}}}}
  /team/memberships/{id}/disable:
    post:
      operationId: disableTeamMembership
      tags: [team]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Membership, content: {application/json: {schema: {$ref: "#/components/schemas/TeamMembership"}}}}}
  /team/invitations:
    get:
      operationId: listTeamInvitations
      tags: [team]
      responses: {"200": {description: Invitations, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/TeamInvitation"}}}}}}
    post:
      operationId: createTeamInvitation
      tags: [team]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TeamInvitationInput"}}}}
      responses: {"201": {description: Invitation, content: {application/json: {schema: {$ref: "#/components/schemas/TeamInvitationCreated"}}}}}
  /team/invitations/{id}/revoke:
    post:
      operationId: revokeTeamInvitation
      tags: [team]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Invitation, content: {application/json: {schema: {$ref: "#/components/schemas/TeamInvitation"}}}}}
  /team/invitations/{id}/rotate-link:
    post:
      operationId: rotateTeamInvitationLink
      tags: [team]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Invitation, content: {application/json: {schema: {$ref: "#/components/schemas/TeamInvitationCreated"}}}}}
  /public/invitations/{token}:
    get:
      operationId: getPublicInvitationPreview
      tags: [team]
      parameters: [{name: token, in: path, required: true, schema: {type: string, minLength: 20}}]
      responses: {"200": {description: Invitation preview, content: {application/json: {schema: {$ref: "#/components/schemas/PublicInvitationPreview"}}}}}
  /invitations/accept:
    post:
      operationId: acceptTeamInvitation
      tags: [team]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AcceptInvitationInput"}}}}
      responses: {"200": {description: Accepted membership, content: {application/json: {schema: {$ref: "#/components/schemas/TeamMembership"}}}}}
components:
  schemas:
    Workspace:
      type: object
      required: [id, storeName, currency, role, permissions]
      properties: {id: {type: integer}, storeName: {type: string}, currency: {type: string}, role: {type: string}, permissions: {type: array, items: {type: string}}}
    TeamAccess:
      type: object
      required: [merchantId, role, permissions, locationIds]
      properties: {merchantId: {type: integer}, role: {type: string}, permissions: {type: array, items: {type: string}}, locationIds: {type: array, items: {type: string, format: uuid}, nullable: true}}
    TeamLocation:
      type: object
      required: [id, name, locationType, country, currency, timezone, address, contact, isActive, isDefault, supportsFulfillment, supportsPos, supportsInventory, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        locationType: {type: string}
        country: {type: string}
        currency: {type: string}
        timezone: {type: string}
        address: {type: object, additionalProperties: true}
        contact: {type: object, additionalProperties: true}
        isActive: {type: boolean}
        isDefault: {type: boolean}
        supportsFulfillment: {type: boolean}
        supportsPos: {type: boolean}
        supportsInventory: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TeamLocationInput:
      allOf: [{$ref: "#/components/schemas/TeamLocationUpdate"}]
      required: [name, country, currency, timezone]
    TeamLocationUpdate:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        locationType: {type: string, minLength: 1, maxLength: 64}
        country: {type: string, minLength: 2, maxLength: 3}
        currency: {type: string, minLength: 3, maxLength: 3}
        timezone: {type: string, minLength: 1, maxLength: 100}
        address: {type: object, additionalProperties: true}
        contact: {type: object, additionalProperties: true}
        isDefault: {type: boolean}
        supportsFulfillment: {type: boolean}
        supportsPos: {type: boolean}
        supportsInventory: {type: boolean}
    TeamRole:
      type: object
      required: [id, key, name, description, isSystem, permissions]
      properties: {id: {type: string, format: uuid}, key: {type: string}, name: {type: string}, description: {type: string, nullable: true}, isSystem: {type: boolean}, permissions: {type: array, items: {type: string}}}
    TeamMembership:
      type: object
      required: [id, clerkUserId, roleId, roleKey, status, locationIds, acceptedAt, disabledAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        clerkUserId: {type: string}
        roleId: {type: string, format: uuid}
        roleKey: {type: string}
        status: {type: string}
        locationIds: {type: array, items: {type: string, format: uuid}}
        acceptedAt: {type: string, format: date-time, nullable: true}
        disabledAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TeamMembershipUpdate:
      type: object
      required: [roleId, locationIds]
      properties: {roleId: {type: string, format: uuid}, locationIds: {type: array, items: {type: string, format: uuid}}}
    TeamInvitation:
      type: object
      required: [id, email, roleId, roleKey, locationIds, expiresAt, acceptedAt, revokedAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        roleId: {type: string, format: uuid}
        roleKey: {type: string}
        locationIds: {type: array, items: {type: string, format: uuid}}
        expiresAt: {type: string, format: date-time}
        acceptedAt: {type: string, format: date-time, nullable: true}
        revokedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
    TeamInvitationInput:
      type: object
      required: [email, roleId, locationIds]
      properties: {email: {type: string, format: email}, roleId: {type: string, format: uuid}, locationIds: {type: array, items: {type: string, format: uuid}}}
    TeamInvitationCreated:
      allOf: [{$ref: "#/components/schemas/TeamInvitation"}]
      required: [inviteUrl, delivery]
      properties: {inviteUrl: {type: string}, delivery: {type: string}}
    PublicInvitationPreview:
      type: object
      required: [merchantName, roleName, expiresAt, status]
      properties: {merchantName: {type: string}, roleName: {type: string}, expiresAt: {type: string, format: date-time}, status: {type: string}}
    AcceptInvitationInput:
      type: object
      required: [token]
      properties: {token: {type: string, minLength: 20}}
    InventoryReservation:
      type: object
      properties:
        id: { type: integer }
        merchantId: { type: integer }
        supplierProductId: { type: integer }
        orderId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        status: { type: string, enum: [reserved, consumed, released, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, merchantId, supplierProductId, orderId, quantity, status, expiresAt, createdAt, updatedAt]
    InventoryMovement:
      type: object
      properties:
        id: { type: integer }
        merchantId: { type: integer }
        supplierProductId: { type: integer }
        orderId: { type: ["integer", "null"] }
        quantityDelta:
          oneOf:
            - { type: integer, maximum: -1 }
            - { type: integer, minimum: 1 }
        reason: { type: string }
        referenceKey: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, merchantId, supplierProductId, orderId, quantityDelta, reason, referenceKey, createdAt]
    InventoryAdjustmentInput:
      type: object
      properties:
        supplierProductId: { type: integer, minimum: 1 }
        quantityDelta: { type: integer, not: 0 }
        reason: { type: string, minLength: 2, maxLength: 500 }
        referenceKey: { type: string, minLength: 8, maxLength: 160 }
      required: [supplierProductId, quantityDelta, reason, referenceKey]
    PaymentIntentInput:
      type: object
      properties:
        orderId: { type: integer, minimum: 1 }
        amountMinor:
          type: integer
          minimum: 1
          description: Must equal the server-computed order amount; never trusted from the client.
        currency: { type: string, minLength: 3, maxLength: 3 }
        method:
          type: string
          enum: [manual_bank_transfer, manual_cash, manual_other]
        evidenceReference: { type: ["string", "null"], maxLength: 500 }
        idempotencyKey: { type: ["string", "null"], minLength: 8, maxLength: 120 }
      required: [orderId, currency, method]
    PaymentVerificationInput:
      type: object
      properties:
        evidenceReference: { type: ["string", "null"], maxLength: 500 }
        note: { type: ["string", "null"], maxLength: 2000 }
    PaymentIntent:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        amountMinor: { type: integer }
        currency: { type: string }
        method: { type: string }
        status:
          type: string
          enum: [created, submitted, verified, failed, canceled, refunded, partially_refunded, disputed]
        evidenceReference: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, orderId, amountMinor, currency, method, status, evidenceReference, createdAt]
    MerchantBalance:
      type: object
      properties:
        currency: { type: string }
        ledgerBalanceMinor: { type: integer }
        availableBalanceMinor: { type: integer }
        heldBalanceMinor: { type: integer }
      required: [currency, ledgerBalanceMinor, availableBalanceMinor, heldBalanceMinor]
    TsPayAccount:
      type: object
      properties:
        id: { type: integer }
        accountNumber: { type: string, pattern: "^TS[0-9]{10}$" }
        currency: { type: string }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, accountNumber, currency, status, createdAt, updatedAt]
    TsPayTransferInput:
      type: object
      properties:
        toAccountNumber: { type: string, pattern: "^TS[0-9]{10}$" }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        note: { type: string, maxLength: 240 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
      required: [toAccountNumber, amount, idempotencyKey]
    TsPayTransfer:
      type: object
      properties:
        id: { type: integer }
        direction: { type: string, enum: [sent, received] }
        fromAccountNumber: { type: string }
        toAccountNumber: { type: string }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string }
        status: { type: string, enum: [completed, rejected] }
        referenceKey: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
      required: [id, direction, fromAccountNumber, toAccountNumber, amountMinor, currency, status, referenceKey, note, createdAt, completedAt]
    TsPayTransaction:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [ledger, transfer, refund, payout] }
        direction: { type: string, enum: [credit, debit, hold] }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string }
        status: { type: string }
        description: { type: string }
        referenceKey: { type: ["string", "null"] }
        occurredAt: { type: string, format: date-time }
      required: [id, kind, direction, amountMinor, currency, status, description, referenceKey, occurredAt]
    RefundInput:
      type: object
      properties:
        orderId: { type: integer, minimum: 1 }
        amountMinor: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 2, maxLength: 2000 }
        inventoryRestock: { type: boolean, default: false }
      required: [orderId, amountMinor, reason]
    RefundRecord:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        amountMinor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [requested, approved, rejected, processed, canceled] }
        reason: { type: string }
        inventoryRestock: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, orderId, amountMinor, currency, status, reason, inventoryRestock, createdAt]
    ReconciliationInput:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        expectedMinor: { type: integer }
        observedMinor: { type: integer }
        note: { type: ["string", "null"], maxLength: 2000 }
      required: [currency, expectedMinor, observedMinor]
    ReconciliationRecord:
      type: object
      properties:
        id: { type: integer }
        currency: { type: string }
        expectedMinor: { type: integer }
        observedMinor: { type: integer }
        discrepancyMinor: { type: integer }
        status: { type: string, enum: [open, investigating, resolved, void] }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, currency, expectedMinor, observedMinor, discrepancyMinor, status, note, createdAt]
    ReconciliationUpdateInput:
      type: object
      properties:
        status: { type: string, enum: [open, investigating, resolved, void] }
        note: { type: ["string", "null"], maxLength: 2000 }
      required: [status]
    CurrencySettings:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        availableCurrencies:
          type: array
          items: { type: string }
      required: [currency, availableCurrencies]
    CurrencySettingsInput:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
      required: [currency]
    CheckoutSettings:
      type: object
      properties:
        taxRate: { type: number, minimum: 0, maximum: 100 }
        shippingFee: { type: number, minimum: 0 }
        freeShippingThreshold: { type: ["number", "null"], minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
      required: [taxRate, shippingFee, freeShippingThreshold, currency]
    CheckoutSettingsInput:
      type: object
      properties:
        taxRate: { type: number, minimum: 0, maximum: 100 }
        shippingFee: { type: number, minimum: 0 }
        freeShippingThreshold: { type: ["number", "null"], minimum: 0 }
      required: [taxRate, shippingFee, freeShippingThreshold]
    MarketExchangeRate:
      type: object
      properties:
        base: { type: string }
        quote: { type: string }
        rate: { type: number }
        source: { type: string }
        fetchedAt: { type: string, format: date-time }
        asOf: { type: ["string", "null"], format: date-time }
      required: [base, quote, rate, source, fetchedAt, asOf]
    Store:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        storeName: { type: string }
        storeDescription: { type: ["string", "null"], maxLength: 500 }
        storeContactEmail: { type: ["string", "null"], format: email }
        storePhone: { type: ["string", "null"], maxLength: 40 }
        storeWebsite: { type: ["string", "null"], format: uri }
        storeAddress: { type: ["object", "null"], additionalProperties: true }
        publicStoreKey: { type: string }
        storefrontTheme: { $ref: "#/components/schemas/StorefrontTheme" }
        storefrontSections:
          type: array
          items: { $ref: "#/components/schemas/StorefrontSection" }
        storefrontPublished: { type: boolean }
        storeSlug: { type: string }
        merchantKey: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, name, storeName, storeDescription, storeContactEmail, storePhone, storeWebsite, storeAddress, publicStoreKey, storefrontTheme, storefrontSections, storefrontPublished, storeSlug, merchantKey, createdAt]
    StoreInput:
      type: object
      properties:
        storeName: { type: string, minLength: 2, maxLength: 80 }
        storeDescription: { type: ["string", "null"], maxLength: 500 }
        storeContactEmail: { type: ["string", "null"], format: email }
        storePhone: { type: ["string", "null"], maxLength: 40 }
        storeWebsite: { type: ["string", "null"], format: uri }
        storeAddress: { type: ["object", "null"], additionalProperties: true }
        storefrontTheme: { $ref: "#/components/schemas/StorefrontTheme" }
        storefrontSections:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/StorefrontSection" }
        storefrontPublished: { type: boolean }
      required: [storeName]
    StorefrontTheme:
      type: object
      properties:
        accentColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        backgroundColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        textColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        layout: { type: string, enum: [editorial, minimal, catalog] }
        announcement: { type: string, maxLength: 160 }
