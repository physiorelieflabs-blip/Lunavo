openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TS Commerce merchant and master-admin operations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Merchant dashboard operations
  - name: billing
    description: Merchant subscription billing
  - name: admin
    description: Master admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get merchant dashboard overview
      responses:
        "200":
          description: Merchant overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /settings/currency:
    get:
      operationId: getCurrencySettings
      tags: [settings]
      summary: Get the merchant settlement currency
      responses:
        "200":
          description: Currency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySettings"
    put:
      operationId: updateCurrencySettings
      tags: [settings]
      summary: Change the merchant settlement currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencySettingsInput"
      responses:
        "200":
          description: Updated currency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySettings"
  /settings/fx:
    get:
      operationId: getMarketExchangeRate
      tags: [settings]
      summary: Get a market-sourced exchange rate
      parameters:
        - name: base
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: quote
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: Current market exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketExchangeRate"
  /store:
    post:
      operationId: createStore
      tags: [dashboard]
      summary: Create or update the authenticated merchant store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Persisted merchant store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
  /dashboard/activity:
    get:
      operationId: listDashboardActivity
      tags: [dashboard]
      summary: List recent merchant activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /ai/overview:
    get:
      operationId: getAiOverview
      tags: [ai]
      summary: Get first-party AI business intelligence
      responses:
        "200":
          description: Tenant-scoped AI overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiOverview"
  /ai/train:
    post:
      operationId: trainAiModel
      tags: [ai]
      summary: Train the local commerce signals model
      responses:
        "201":
          description: Local model training result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
  /ai/settings:
    get:
      operationId: getAiSettings
      tags: [ai]
      summary: Get AI autonomy and training settings
      responses:
        "200":
          description: AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
    put:
      operationId: updateAiSettings
      tags: [ai]
      summary: Update AI autonomy and training settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingsInput"
      responses:
        "200":
          description: Updated AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
  /ai/actions:
    get:
      operationId: listAiActions
      tags: [ai]
      summary: List AI actions and approvals
      responses:
        "200":
          description: Tenant-scoped AI action history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAction"
    post:
      operationId: createAiAction
      tags: [ai]
      summary: Send an AI recommendation to the approval center
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiActionInput"
      responses:
        "201":
          description: AI action awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /ai/actions/{id}/approve:
    patch:
      operationId: approveAiAction
      tags: [ai]
      summary: Approve a reversible AI action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved AI action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /ai/actions/{id}/reject:
    patch:
      operationId: rejectAiAction
      tags: [ai]
      summary: Reject an AI action before execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected AI action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /ai/actions/{id}/execute:
    post:
      operationId: executeAiAction
      tags: [ai]
      summary: Execute an approved, reversible AI preparation action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Executed AI action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /ai/actions/{id}/rollback:
    post:
      operationId: rollbackAiAction
      tags: [ai]
      summary: Roll back an executed AI preparation action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rolled back AI action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /ai/research:
    post:
      operationId: researchWeb
      tags: [ai]
      summary: Perform a read-only, source-attributed web research pass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebResearchInput"
      responses:
        "200":
          description: Web research results with source attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebResearchResponse"
  /customers:
    get:
      operationId: listCustomers
      tags: [dashboard]
      summary: List the merchant's customers
      responses:
        "200":
          description: Customer records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerRecord"
  /orders:
    get:
      operationId: listOrders
      tags: [dashboard]
      summary: List the merchant's recorded orders
      responses:
        "200":
          description: Order records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderRecord"
    post:
      operationId: createOrder
      tags: [dashboard]
      summary: Record a merchant sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Recorded order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRecord"
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [dashboard]
      summary: Confirm or cancel a recorded customer order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRecord"
  /security/withdrawal:
    get:
      operationId: getWithdrawalSecurity
      tags: [withdrawals]
      summary: Get withdrawal security setup status
      responses:
        "200":
          description: Withdrawal security status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /security/withdrawal/setup:
    post:
      operationId: beginWithdrawalSecuritySetup
      tags: [withdrawals]
      summary: Begin authenticator setup for withdrawals
      responses:
        "201":
          description: Authenticator setup details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSetup"
  /security/withdrawal/confirm:
    post:
      operationId: confirmWithdrawalSecuritySetup
      tags: [withdrawals]
      summary: Confirm authenticator setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: Withdrawal security enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /security/withdrawal/pins:
    post:
      operationId: setWithdrawalPins
      tags: [withdrawals]
      summary: Configure the required merchant or admin withdrawal PIN set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalPinsInput"
      responses:
        "200":
          description: Withdrawal PIN security status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List the merchant's withdrawal requests
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WithdrawalRecord"
    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Request a withdrawal from available earnings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRecord"
  /bank-account:
    get:
      operationId: getLinkedBankAccount
      tags: [withdrawals]
      summary: Get the merchant's linked withdrawal bank account
      responses:
        "200":
          description: Linked bank account, if configured
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LinkedBankAccount"
                  - type: "null"
    put:
      operationId: saveLinkedBankAccount
      tags: [withdrawals]
      summary: Create or replace the merchant's linked withdrawal bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountInput"
      responses:
        "200":
          description: Linked bank account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedBankAccount"
    delete:
      operationId: deleteLinkedBankAccount
      tags: [withdrawals]
      summary: Remove the merchant's linked withdrawal bank account
      responses:
        "204":
          description: Bank account removed
  /supplier-products:
    get:
      operationId: listSupplierProducts
      tags: [suppliers]
      summary: List products imported from public supplier pages
      responses:
        "200":
          description: Imported products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierProductRecord"
    post:
      operationId: importSupplierProduct
      tags: [suppliers]
      summary: Save a reviewed product imported from a public supplier URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierProductInput"
      responses:
        "201":
          description: Imported product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /supplier-products/analyze:
    post:
      operationId: analyzeSupplierProduct
      tags: [suppliers]
      summary: Analyze a public supplier URL without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierAnalyzeInput"
      responses:
        "200":
          description: Extracted product preview and duplicate candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierAnalyzeResponse"
  /supplier-products/batch:
    post:
      operationId: importSupplierProductBatch
      tags: [suppliers]
      summary: Analyze and save multiple public supplier URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBatchInput"
      responses:
        "200":
          description: Per-URL batch results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierBatchResponse"
  /supplier-import-history:
    get:
      operationId: listSupplierImportHistory
      tags: [suppliers]
      summary: List supplier import attempts and refresh history
      responses:
        "200":
          description: Supplier import history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierImportAttempt"
  /supplier-products/manual:
    post:
      operationId: createManualSupplierProduct
      tags: [suppliers]
      summary: Create a product manually when automatic extraction is unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualSupplierProductInput"
      responses:
        "201":
          description: Manually created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /supplier-products/{id}:
    patch:
      operationId: updateSupplierProduct
      tags: [suppliers]
      summary: Edit an imported supplier product before or after publishing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierProductUpdateInput"
      responses:
        "200":
          description: Updated supplier product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /supplier-products/{id}/refresh:
    post:
      operationId: refreshSupplierProduct
      tags: [suppliers]
      summary: Refresh a product source and return a reviewable diff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Source refresh diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierRefreshResponse"
  /supplier-products/{id}/refresh/accept:
    post:
      operationId: acceptSupplierRefresh
      tags: [suppliers]
      summary: Accept selected source refresh fields
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierRefreshAcceptInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List supplier records
      responses:
        "200":
          description: Supplier records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierRecord"
  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier notes and contact details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdateInput"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierRecord"
  /dropship/queue:
    get:
      operationId: listDropshipQueue
      tags: [dropshipping]
      summary: List product-linked orders waiting for supplier fulfillment
      responses:
        "200":
          description: Internal dropshipping fulfillment queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DropshipQueueRecord"
  /dropship/queue/{id}:
    patch:
      operationId: updateDropshipStatus
      tags: [dropshipping]
      summary: Update the internal supplier fulfillment status for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DropshipStatusInput"
      responses:
        "200":
          description: Updated dropshipping queue item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropshipQueueRecord"
  /public/store/{merchantKey}:
    get:
      operationId: getPublicStore
      tags: [checkout]
      summary: View a merchant's public catalog
      parameters:
        - name: merchantKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Public catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStore"
  /public/store/{merchantKey}/checkout:
    post:
      operationId: createPublicCheckout
      tags: [checkout]
      summary: Create a pending customer order from a public catalog
      parameters:
        - name: merchantKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutInput"
      responses:
        "201":
          description: Pending order awaiting merchant payment confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCheckoutOrder"
  /subscription:
    get:
      operationId: getSubscription
      tags: [billing]
      summary: Get current merchant subscription
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [billing]
      summary: Create or activate a merchant subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /subscription/bank-transfer:
    post:
      operationId: submitBankTransfer
      tags: [billing]
      summary: Submit a bank transfer reference for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankTransferInput"
      responses:
        "201":
          description: Transfer submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
  /subscription/use-earnings:
    post:
      operationId: paySubscriptionFromEarnings
      tags: [billing]
      summary: Apply merchant earnings to the subscription fee
      responses:
        "201":
          description: Earnings applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get master admin platform overview
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/merchants:
    get:
      operationId: listMerchants
      tags: [admin]
      summary: List merchants for the master admin
      responses:
        "200":
          description: Merchant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Merchant"
  /admin/merchants/{id}/status:
    patch:
      operationId: updateMerchantStatus
      tags: [admin]
      summary: Update merchant access status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantStatusInput"
      responses:
        "200":
          description: Updated merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
  /admin/payments/{id}/review:
    patch:
      operationId: reviewBankTransfer
      tags: [admin]
      summary: Approve or reject a submitted bank transfer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentReviewInput"
      responses:
        "200":
          description: Reviewed payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
  /admin/withdrawals:
    get:
      operationId: listAdminWithdrawals
      tags: [admin]
      summary: List withdrawal requests for the master admin
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWithdrawalRecord"
  /admin/withdrawals/{id}/review:
    patch:
      operationId: reviewWithdrawal
      tags: [admin]
      summary: Review or mark a withdrawal request as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWithdrawalReviewInput"
      responses:
        "200":
          description: Reviewed withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawalRecord"
  /admin/withdrawals/{id}/details:
    post:
      operationId: revealWithdrawalDetails
      tags: [admin]
      summary: Reveal a withdrawal destination after admin step-up verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWithdrawalDetailsInput"
      responses:
        "200":
          description: Secure transfer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalDetails"
  /payments:
    post:
      operationId: createPaymentIntent
      tags: [payments]
      summary: Create an authoritative internal payment intent for an order
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentInput"
      responses:
        "201":
          description: Payment intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
  /payments/{id}/verify:
    post:
      operationId: verifyPayment
      tags: [payments]
      summary: Verify submitted manual payment evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentVerificationInput" }
      responses:
        "200":
          description: Verified payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
  /balances:
    get:
      operationId: getMerchantBalances
      tags: [payments]
      summary: Get ledger-derived merchant balances
      responses:
        "200":
          description: Currency-separated balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MerchantBalance" }
  /refunds:
    post:
      operationId: createRefund
      tags: [payments]
      summary: Request a full or partial refund
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundInput" }
      responses:
        "201":
          description: Refund request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundRecord" }
  /refunds/{id}/approve:
    post:
      operationId: approveRefund
      tags: [payments]
      summary: Approve and post a refund reversal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Approved refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundRecord" }
  /reconciliation:
    post:
      operationId: createReconciliation
      tags: [payments]
      summary: Record a reconciliation discrepancy without rewriting ledger history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationInput" }
      responses:
        "201":
          description: Reconciliation record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRecord" }
    get:
      operationId: listReconciliations
      tags: [payments]
      summary: List reconciliation records
      responses:
        "200":
          description: Reconciliation records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReconciliationRecord" }
  /reconciliation/{id}:
    patch:
      operationId: updateReconciliation
      tags: [payments]
      summary: Update reconciliation workflow status without changing ledger history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationUpdateInput" }
      responses:
        "200":
          description: Updated reconciliation record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRecord" }
  /inventory/reservations:
    get:
      operationId: listInventoryReservations
      tags: [inventory]
      summary: List tenant-scoped inventory reservations
      responses:
        "200":
          description: Inventory reservations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryReservation" }
  /inventory/movements:
    get:
      operationId: listInventoryMovements
      tags: [inventory]
      summary: List immutable tenant-scoped inventory movements
      responses:
        "200":
          description: Inventory movement history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryMovement" }
  /inventory/adjustments:
    post:
      operationId: createInventoryAdjustment
      tags: [inventory]
      summary: Apply an idempotent manual stock adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryAdjustmentInput" }
      responses:
        "201":
          description: Stock adjustment movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryMovement" }
components:
  schemas:
    InventoryReservation:
      type: object
      properties:
        id: { type: integer }
        merchantId: { type: integer }
        supplierProductId: { type: integer }
        orderId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        status: { type: string, enum: [reserved, consumed, released, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, merchantId, supplierProductId, orderId, quantity, status, expiresAt, createdAt, updatedAt]
    InventoryMovement:
      type: object
      properties:
        id: { type: integer }
        merchantId: { type: integer }
        supplierProductId: { type: integer }
        orderId: { type: ["integer", "null"] }
        quantityDelta:
          oneOf:
            - { type: integer, maximum: -1 }
            - { type: integer, minimum: 1 }
        reason: { type: string }
        referenceKey: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, merchantId, supplierProductId, orderId, quantityDelta, reason, referenceKey, createdAt]
    InventoryAdjustmentInput:
      type: object
      properties:
        supplierProductId: { type: integer, minimum: 1 }
        quantityDelta: { type: integer, not: 0 }
        reason: { type: string, minLength: 2, maxLength: 500 }
        referenceKey: { type: string, minLength: 8, maxLength: 160 }
      required: [supplierProductId, quantityDelta, reason, referenceKey]
    PaymentIntentInput:
      type: object
      properties:
        orderId: { type: integer, minimum: 1 }
        amountMinor:
          type: integer
          minimum: 1
          description: Must equal the server-computed order amount; never trusted from the client.
        currency: { type: string, minLength: 3, maxLength: 3 }
        method:
          type: string
          enum: [manual_bank_transfer, manual_cash, manual_other]
        evidenceReference: { type: ["string", "null"], maxLength: 500 }
        idempotencyKey: { type: ["string", "null"], minLength: 8, maxLength: 120 }
      required: [orderId, currency, method]
    PaymentVerificationInput:
      type: object
      properties:
        evidenceReference: { type: ["string", "null"], maxLength: 500 }
        note: { type: ["string", "null"], maxLength: 2000 }
    PaymentIntent:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        amountMinor: { type: integer }
        currency: { type: string }
        method: { type: string }
        status:
          type: string
          enum: [created, submitted, verified, failed, canceled, refunded, partially_refunded, disputed]
        evidenceReference: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, orderId, amountMinor, currency, method, status, evidenceReference, createdAt]
    MerchantBalance:
      type: object
      properties:
        currency: { type: string }
        ledgerBalanceMinor: { type: integer }
        availableBalanceMinor: { type: integer }
        heldBalanceMinor: { type: integer }
      required: [currency, ledgerBalanceMinor, availableBalanceMinor, heldBalanceMinor]
    RefundInput:
      type: object
      properties:
        orderId: { type: integer, minimum: 1 }
        amountMinor: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 2, maxLength: 2000 }
        inventoryRestock: { type: boolean, default: false }
      required: [orderId, amountMinor, reason]
    RefundRecord:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        amountMinor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [requested, approved, rejected, processed, canceled] }
        reason: { type: string }
        inventoryRestock: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, orderId, amountMinor, currency, status, reason, inventoryRestock, createdAt]
    ReconciliationInput:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        expectedMinor: { type: integer }
        observedMinor: { type: integer }
        note: { type: ["string", "null"], maxLength: 2000 }
      required: [currency, expectedMinor, observedMinor]
    ReconciliationRecord:
      type: object
      properties:
        id: { type: integer }
        currency: { type: string }
        expectedMinor: { type: integer }
        observedMinor: { type: integer }
        discrepancyMinor: { type: integer }
        status: { type: string, enum: [open, investigating, resolved, void] }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, currency, expectedMinor, observedMinor, discrepancyMinor, status, note, createdAt]
    ReconciliationUpdateInput:
      type: object
      properties:
        status: { type: string, enum: [open, investigating, resolved, void] }
        note: { type: ["string", "null"], maxLength: 2000 }
      required: [status]
    CurrencySettings:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        availableCurrencies:
          type: array
          items: { type: string }
      required: [currency, availableCurrencies]
    CurrencySettingsInput:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
      required: [currency]
    MarketExchangeRate:
      type: object
      properties:
        base: { type: string }
        quote: { type: string }
        rate: { type: number }
        source: { type: string }
        fetchedAt: { type: string, format: date-time }
        asOf: { type: ["string", "null"], format: date-time }
      required: [base, quote, rate, source, fetchedAt, asOf]
    Store:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        storeName: { type: string }
        storeSlug: { type: string }
        merchantKey: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, name, storeName, storeSlug, merchantKey, createdAt]
    StoreInput:
      type: object
      properties:
        storeName: { type: string, minLength: 2, maxLength: 80 }
      required: [storeName]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ActivityItem:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        amount: { type: ["number", "null"] }
        currency: { type: string }
        occurredAt: { type: string, format: date-time }
        tone: { type: string }
      required: [id, type, title, description, amount, currency, occurredAt, tone]
    CustomerRecord:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        orderCount: { type: integer }
        totalSpent: { type: number }
        createdAt: { type: string, format: date-time }
      required: [id, name, email, phone, orderCount, totalSpent, createdAt]
    OrderRecord:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        customerName: { type: string }
        customerEmail: { type: string, format: email }
        total: { type: number }
        quantity: { type: integer, minimum: 1 }
        currency: { type: string }
        status: { type: string }
        supplierProductId: { type: ["integer", "null"] }
        productTitle: { type: ["string", "null"] }
        shippingAddress: { type: ["string", "null"] }
        fulfillmentStatus: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, orderNumber, customerName, customerEmail, total, quantity, currency, status, supplierProductId, productTitle, shippingAddress, fulfillmentStatus, createdAt]
    CreateOrderInput:
      type: object
      properties:
        customerName: { type: string, minLength: 2, maxLength: 160 }
        customerEmail: { type: string, format: email }
        customerPhone: { type: string, maxLength: 40 }
        total: { type: number, exclusiveMinimum: 0 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        status:
          type: string
          enum: [pending, paid, fulfilled]
        orderNumber: { type: string, minLength: 2, maxLength: 80 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
        supplierProductId: { type: integer, minimum: 1 }
        shippingAddress: { type: string, maxLength: 500 }
      required: [customerName, customerEmail, total]
    OrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [paid, cancelled]
      required: [status]
    AiModel:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        version: { type: string }
        modelType: { type: string }
        status: { type: string }
        trainingExamples: { type: integer }
        evaluationScore: { type: ["number", "null"] }
        trainedAt: { type: ["string", "null"], format: date-time }
      required: [id, name, version, modelType, status, trainingExamples, evaluationScore, trainedAt]
    AiSettings:
      type: object
      properties:
        autonomyLevel: { type: integer, minimum: 0, maximum: 4 }
        runMyBusiness: { type: boolean }
        trainingOptIn: { type: boolean }
      required: [autonomyLevel, runMyBusiness, trainingOptIn]
    AiSettingsInput:
      type: object
      properties:
        autonomyLevel: { type: integer, minimum: 0, maximum: 4 }
        runMyBusiness: { type: boolean }
        trainingOptIn: { type: boolean }
      required: [autonomyLevel, runMyBusiness, trainingOptIn]
    AiMetric:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number }
        detail: { type: string }
      required: [key, label, value, detail]
    AiSignal:
      type: object
      properties:
        title: { type: string }
        detail: { type: string }
        severity: { type: string }
        agent: { type: string }
      required: [title, detail, severity, agent]
    AiRecommendation:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        reason: { type: string }
        agent: { type: string }
        risk: { type: string }
        reversible: { type: boolean }
      required: [id, title, detail, reason, agent, risk, reversible]
    AiAgent:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        focus: { type: string }
        status: { type: string }
        insight: { type: string }
      required: [key, name, focus, status, insight]
    AiAction:
      type: object
      properties:
        id: { type: integer }
        agent: { type: string }
        actionType: { type: string }
        title: { type: string }
        reason: { type: string }
        status: { type: string }
        risk: { type: string }
        reversible: { type: boolean }
        approvalRequired: { type: boolean }
        rollbackAvailable: { type: boolean }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: ["string", "null"], format: date-time }
        executedAt: { type: ["string", "null"], format: date-time }
        rolledBackAt: { type: ["string", "null"], format: date-time }
        result: { type: ["object", "null"], additionalProperties: true }
      required: [id, agent, actionType, title, reason, status, risk, reversible, approvalRequired, rollbackAvailable, createdAt, approvedAt, executedAt, rolledBackAt, result]
    AiActionInput:
      type: object
      properties:
        agent: { type: string, minLength: 2, maxLength: 80 }
        actionType: { type: string, minLength: 2, maxLength: 80 }
        title: { type: string, minLength: 2, maxLength: 240 }
        reason: { type: string, minLength: 2, maxLength: 2000 }
        risk: { type: string, enum: [low, medium, high] }
        reversible: { type: boolean }
      required: [agent, actionType, title, reason, risk, reversible]
    WebResearchInput:
      type: object
      properties:
        query: { type: string, minLength: 3, maxLength: 180 }
      required: [query]
    WebResearchSource:
      type: object
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        snippet: { type: string }
      required: [title, url, snippet]
    WebResearchResponse:
      type: object
      properties:
        query: { type: string }
        summary: { type: string }
        searchedAt: { type: string, format: date-time }
        source: { type: string }
        limitations:
          type: array
          items: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/WebResearchSource" }
      required: [query, summary, searchedAt, source, limitations, sources]
    AiOverview:
      type: object
      properties:
        model: { $ref: "#/components/schemas/AiModel" }
        settings: { $ref: "#/components/schemas/AiSettings" }
        healthScore: { type: number }
        brief: { type: string }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/AiMetric" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/AiSignal" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/AiRecommendation" }
        agents:
          type: array
          items: { $ref: "#/components/schemas/AiAgent" }
        awaitingApproval: { type: integer }
      required: [model, settings, healthScore, brief, metrics, signals, recommendations, agents, awaitingApproval]
    Subscription:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        isAdmin: { type: boolean }
        amountDue: { type: number }
        amountPaid: { type: number }
        earningsHeld: { type: number }
        status: { type: string }
        registeredAt: { type: string, format: date-time }
        warningDay: { type: integer }
        suspensionDay: { type: integer }
        nextAction: { type: string }
        paymentMethod: { type: ["string", "null"] }
        serverNow: { type: string, format: date-time }
        trialEndsAt: { type: string, format: date-time }
        daysElapsed: { type: integer }
        daysRemaining: { type: integer }
      required:
        - id
        - email
        - isAdmin
        - amountDue
        - amountPaid
        - earningsHeld
        - status
        - registeredAt
        - warningDay
        - suspensionDay
        - serverNow
        - trialEndsAt
        - daysElapsed
        - daysRemaining
        - nextAction
        - paymentMethod
    DashboardOverview:
      type: object
      properties:
        currency: { type: string }
        storeName: { type: string }
        storeSlug: { type: string }
        revenue: { type: number }
        revenueChange: { type: number }
        orders: { type: integer }
        customers: { type: integer }
        availableBalance: { type: number }
        pendingBalance: { type: number }
        withdrawalReserved: { type: number }
        earningsHeldForSubscription: { type: number }
        subscription: { $ref: "#/components/schemas/Subscription" }
        revenueSeries:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePoint"
      required:
        - currency
        - storeName
        - storeSlug
        - revenue
        - revenueChange
        - orders
        - customers
        - availableBalance
        - pendingBalance
         - withdrawalReserved
        - earningsHeldForSubscription
        - subscription
        - revenueSeries
    RevenuePoint:
      type: object
      properties:
        label: { type: string }
        amount: { type: number }
      required: [label, amount]
    Merchant:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        storeName: { type: string }
        status: { type: string }
        subscriptionStatus: { type: string }
        amountPaid: { type: number }
        amountDue: { type: number }
        earningsHeld: { type: number }
        registeredAt: { type: string, format: date-time }
        daysSinceRegistration: { type: integer }
      required:
        - id
        - name
        - email
        - storeName
        - status
        - subscriptionStatus
        - amountPaid
        - amountDue
        - earningsHeld
        - registeredAt
        - daysSinceRegistration
    AdminOverview:
      type: object
      properties:
        currency: { type: string }
        platformRevenue: { type: number }
        subscriptionRevenue: { type: number }
        availableBalance: { type: number }
        withdrawalReserved: { type: number }
        heldMerchantRevenue: { type: number }
        activeMerchants: { type: integer }
        attentionRequired: { type: integer }
        suspendedAccounts: { type: integer }
        recentPayments:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRecord"
      required:
        - currency
        - platformRevenue
        - subscriptionRevenue
        - availableBalance
        - withdrawalReserved
        - heldMerchantRevenue
        - activeMerchants
        - attentionRequired
        - suspendedAccounts
        - recentPayments
    PaymentRecord:
      type: object
      properties:
        id: { type: integer }
        merchantName: { type: string }
        amount: { type: number }
        currency: { type: string }
        method: { type: string }
        reference: { type: string }
        senderName: { type: ["string", "null"] }
        status: { type: string }
        reviewNote: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, merchantName, amount, currency, method, reference, senderName, status, reviewNote, reviewedAt, createdAt]
    SubscriptionInput:
      type: object
      properties:
        method:
          type: string
          enum: [earnings, bank]
      required: [method]
    BankTransferInput:
      type: object
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        reference: { type: string, minLength: 3 }
        senderName: { type: string, minLength: 2 }
      required: [amount, reference, senderName]
    MerchantStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended, banned]
      required: [status]
    PaymentReviewInput:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, rejected]
        note:
          type: string
          maxLength: 500
      required: [status]
    WithdrawalSecurity:
      type: object
      properties:
        enabled: { type: boolean }
        pendingSetup: { type: boolean }
        merchantPinsConfigured: { type: integer, minimum: 0, maximum: 2 }
        adminPinsConfigured: { type: integer, minimum: 0, maximum: 5 }
        requiredPins: { type: integer, enum: [2, 5] }
      required: [enabled, pendingSetup, merchantPinsConfigured, adminPinsConfigured, requiredPins]
    WithdrawalSetup:
      type: object
      properties:
        secret: { type: string }
        otpAuthUri: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [secret, otpAuthUri, expiresAt]
    TotpCodeInput:
      type: object
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
      required: [code]
    WithdrawalPinsInput:
      type: object
      properties:
        pins:
          type: array
          minItems: 2
          maxItems: 5
          items: { type: string, pattern: "^[0-9]{6}$" }
      required: [pins]
    WithdrawalInput:
      type: object
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        totpCode: { type: string, pattern: "^[0-9]{6}$" }
        pinCodes:
          type: array
          minItems: 2
          maxItems: 5
          items: { type: string, pattern: "^[0-9]{6}$" }
        confirmation: { type: string, minLength: 12, maxLength: 120 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
      required: [amount, totpCode, pinCodes]
    BankAccountInput:
      type: object
      properties:
        beneficiaryName: { type: string, minLength: 2, maxLength: 160 }
        bankName: { type: string, minLength: 2, maxLength: 120 }
        bankCode: { type: string, minLength: 2, maxLength: 40 }
        accountNumber: { type: string, minLength: 4, maxLength: 40 }
      required: [beneficiaryName, bankName, bankCode, accountNumber]
    LinkedBankAccount:
      type: object
      properties:
        id: { type: integer }
        beneficiaryName: { type: string }
        bankName: { type: string }
        bankCode: { type: string }
        accountLast4: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, beneficiaryName, bankName, bankCode, accountLast4, createdAt, updatedAt]
    WithdrawalRecord:
      type: object
      properties:
        id: { type: integer }
        amount: { type: number }
        currency: { type: string }
        status: { type: string }
        beneficiaryName: { type: string }
        bankName: { type: string }
        accountLast4: { type: string }
        reviewNote: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        paidAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, amount, currency, status, beneficiaryName, bankName, accountLast4, reviewNote, reviewedAt, paidAt, createdAt]
    AdminWithdrawalRecord:
      allOf:
        - $ref: "#/components/schemas/WithdrawalRecord"
        - type: object
          properties:
            merchantName: { type: string }
            merchantEmail: { type: string, format: email }
          required: [merchantName, merchantEmail]
    WithdrawalDetails:
      type: object
      properties:
        id: { type: integer }
        beneficiaryName: { type: string }
        bankName: { type: string }
        bankCode: { type: string }
        accountNumber: { type: string }
      required: [id, beneficiaryName, bankName, bankCode, accountNumber]
    AdminWithdrawalReviewInput:
      type: object
      properties:
