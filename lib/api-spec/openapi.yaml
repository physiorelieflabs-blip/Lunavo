openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TS Commerce merchant and master-admin operations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Merchant dashboard operations
  - name: billing
    description: Merchant subscription billing
  - name: admin
    description: Master admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get merchant dashboard overview
      responses:
        "200":
          description: Merchant overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /dashboard/activity:
    get:
      operationId: listDashboardActivity
      tags: [dashboard]
      summary: List recent merchant activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /customers:
    get:
      operationId: listCustomers
      tags: [dashboard]
      summary: List the merchant's customers
      responses:
        "200":
          description: Customer records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerRecord"
  /orders:
    get:
      operationId: listOrders
      tags: [dashboard]
      summary: List the merchant's recorded orders
      responses:
        "200":
          description: Order records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderRecord"
    post:
      operationId: createOrder
      tags: [dashboard]
      summary: Record a merchant sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Recorded order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRecord"
  /security/withdrawal:
    get:
      operationId: getWithdrawalSecurity
      tags: [withdrawals]
      summary: Get withdrawal security setup status
      responses:
        "200":
          description: Withdrawal security status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /security/withdrawal/setup:
    post:
      operationId: beginWithdrawalSecuritySetup
      tags: [withdrawals]
      summary: Begin authenticator setup for withdrawals
      responses:
        "201":
          description: Authenticator setup details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSetup"
  /security/withdrawal/confirm:
    post:
      operationId: confirmWithdrawalSecuritySetup
      tags: [withdrawals]
      summary: Confirm authenticator setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: Withdrawal security enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List the merchant's withdrawal requests
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WithdrawalRecord"
    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Request a withdrawal from available earnings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRecord"
  /supplier-products:
    get:
      operationId: listSupplierProducts
      tags: [suppliers]
      summary: List products imported from public supplier pages
      responses:
        "200":
          description: Imported products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierProductRecord"
    post:
      operationId: importSupplierProduct
      tags: [suppliers]
      summary: Import a product from a public supplier URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierProductInput"
      responses:
        "201":
          description: Imported product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /subscription:
    get:
      operationId: getSubscription
      tags: [billing]
      summary: Get current merchant subscription
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [billing]
      summary: Create or activate a merchant subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /subscription/bank-transfer:
    post:
      operationId: submitBankTransfer
      tags: [billing]
      summary: Submit a bank transfer reference for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankTransferInput"
      responses:
        "201":
          description: Transfer submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
  /subscription/use-earnings:
    post:
      operationId: paySubscriptionFromEarnings
      tags: [billing]
      summary: Apply merchant earnings to the subscription fee
      responses:
        "201":
          description: Earnings applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get master admin platform overview
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/merchants:
    get:
      operationId: listMerchants
      tags: [admin]
      summary: List merchants for the master admin
      responses:
        "200":
          description: Merchant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Merchant"
  /admin/merchants/{id}/status:
    patch:
      operationId: updateMerchantStatus
      tags: [admin]
      summary: Update merchant access status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantStatusInput"
      responses:
        "200":
          description: Updated merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
  /admin/payments/{id}/review:
    patch:
      operationId: reviewBankTransfer
      tags: [admin]
      summary: Approve or reject a submitted bank transfer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentReviewInput"
      responses:
        "200":
          description: Reviewed payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
  /admin/withdrawals:
    get:
      operationId: listAdminWithdrawals
      tags: [admin]
      summary: List withdrawal requests for the master admin
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWithdrawalRecord"
  /admin/withdrawals/{id}/review:
    patch:
      operationId: reviewWithdrawal
      tags: [admin]
      summary: Review or mark a withdrawal request as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWithdrawalReviewInput"
      responses:
        "200":
          description: Reviewed withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawalRecord"
  /admin/withdrawals/{id}/details:
    post:
      operationId: revealWithdrawalDetails
      tags: [admin]
      summary: Reveal a withdrawal destination after admin step-up verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWithdrawalDetailsInput"
      responses:
        "200":
          description: Secure transfer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalDetails"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ActivityItem:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        amount: { type: ["number", "null"] }
        currency: { type: string }
        occurredAt: { type: string, format: date-time }
        tone: { type: string }
      required: [id, type, title, description, amount, currency, occurredAt, tone]
    CustomerRecord:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        orderCount: { type: integer }
        totalSpent: { type: number }
        createdAt: { type: string, format: date-time }
      required: [id, name, email, phone, orderCount, totalSpent, createdAt]
    OrderRecord:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        customerName: { type: string }
        customerEmail: { type: string, format: email }
        total: { type: number }
        currency: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, orderNumber, customerName, customerEmail, total, currency, status, createdAt]
    CreateOrderInput:
      type: object
      properties:
        customerName: { type: string, minLength: 2, maxLength: 160 }
        customerEmail: { type: string, format: email }
        customerPhone: { type: string, maxLength: 40 }
        total: { type: number, exclusiveMinimum: 0 }
        status:
          type: string
          enum: [pending, paid, fulfilled]
        orderNumber: { type: string, minLength: 2, maxLength: 80 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
      required: [customerName, customerEmail, total]
    Subscription:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        isAdmin: { type: boolean }
        amountDue: { type: number }
        amountPaid: { type: number }
        earningsHeld: { type: number }
        status: { type: string }
        registeredAt: { type: string, format: date-time }
        warningDay: { type: integer }
        suspensionDay: { type: integer }
        nextAction: { type: string }
        paymentMethod: { type: ["string", "null"] }
      required:
        - id
        - email
        - isAdmin
        - amountDue
        - amountPaid
        - earningsHeld
        - status
        - registeredAt
        - warningDay
        - suspensionDay
        - nextAction
        - paymentMethod
    DashboardOverview:
      type: object
      properties:
        storeName: { type: string }
        storeSlug: { type: string }
        revenue: { type: number }
        revenueChange: { type: number }
        orders: { type: integer }
        customers: { type: integer }
        availableBalance: { type: number }
        pendingBalance: { type: number }
        withdrawalReserved: { type: number }
        earningsHeldForSubscription: { type: number }
        subscription: { $ref: "#/components/schemas/Subscription" }
        revenueSeries:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePoint"
      required:
        - storeName
        - storeSlug
        - revenue
        - revenueChange
        - orders
        - customers
        - availableBalance
        - pendingBalance
         - withdrawalReserved
        - earningsHeldForSubscription
        - subscription
        - revenueSeries
    RevenuePoint:
      type: object
      properties:
        label: { type: string }
        amount: { type: number }
      required: [label, amount]
    Merchant:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        storeName: { type: string }
        status: { type: string }
        subscriptionStatus: { type: string }
        amountPaid: { type: number }
        amountDue: { type: number }
        earningsHeld: { type: number }
        registeredAt: { type: string, format: date-time }
        daysSinceRegistration: { type: integer }
      required:
        - id
        - name
        - email
        - storeName
        - status
        - subscriptionStatus
        - amountPaid
        - amountDue
        - earningsHeld
        - registeredAt
        - daysSinceRegistration
    AdminOverview:
      type: object
      properties:
        platformRevenue: { type: number }
        subscriptionRevenue: { type: number }
        heldMerchantRevenue: { type: number }
        activeMerchants: { type: integer }
        attentionRequired: { type: integer }
        suspendedAccounts: { type: integer }
        recentPayments:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRecord"
      required:
        - platformRevenue
        - subscriptionRevenue
        - heldMerchantRevenue
        - activeMerchants
        - attentionRequired
        - suspendedAccounts
        - recentPayments
    PaymentRecord:
      type: object
      properties:
        id: { type: integer }
        merchantName: { type: string }
        amount: { type: number }
        currency: { type: string }
        method: { type: string }
        reference: { type: string }
        senderName: { type: ["string", "null"] }
        status: { type: string }
        reviewNote: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, merchantName, amount, currency, method, reference, senderName, status, reviewNote, reviewedAt, createdAt]
    SubscriptionInput:
      type: object
      properties:
        method:
          type: string
          enum: [earnings, bank]
      required: [method]
    BankTransferInput:
      type: object
      properties:
        reference: { type: string, minLength: 3 }
        senderName: { type: string, minLength: 2 }
      required: [reference, senderName]
    MerchantStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended, banned]
      required: [status]
    PaymentReviewInput:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, rejected]
        note:
          type: string
          maxLength: 500
      required: [status]
    WithdrawalSecurity:
      type: object
      properties:
        enabled: { type: boolean }
        pendingSetup: { type: boolean }
      required: [enabled, pendingSetup]
    WithdrawalSetup:
      type: object
      properties:
        secret: { type: string }
        otpAuthUri: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [secret, otpAuthUri, expiresAt]
    TotpCodeInput:
      type: object
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
      required: [code]
    WithdrawalInput:
      type: object
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        beneficiaryName: { type: string, minLength: 2, maxLength: 160 }
        bankName: { type: string, minLength: 2, maxLength: 120 }
        bankCode: { type: string, minLength: 2, maxLength: 40 }
        accountNumber: { type: string, minLength: 4, maxLength: 40 }
        totpCode: { type: string, pattern: "^[0-9]{6}$" }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
      required: [amount, beneficiaryName, bankName, bankCode, accountNumber, totpCode]
    WithdrawalRecord:
      type: object
      properties:
        id: { type: integer }
        amount: { type: number }
        currency: { type: string }
        status: { type: string }
        beneficiaryName: { type: string }
        bankName: { type: string }
        accountLast4: { type: string }
        reviewNote: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        paidAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, amount, currency, status, beneficiaryName, bankName, accountLast4, reviewNote, reviewedAt, paidAt, createdAt]
    AdminWithdrawalRecord:
      allOf:
        - $ref: "#/components/schemas/WithdrawalRecord"
        - type: object
          properties:
            merchantName: { type: string }
            merchantEmail: { type: string, format: email }
          required: [merchantName, merchantEmail]
    WithdrawalDetails:
      type: object
      properties:
        id: { type: integer }
        beneficiaryName: { type: string }
        bankName: { type: string }
        bankCode: { type: string }
        accountNumber: { type: string }
      required: [id, beneficiaryName, bankName, bankCode, accountNumber]
    AdminWithdrawalReviewInput:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected, paid]
        note: { type: string, maxLength: 500 }
        securityCode: { type: string, pattern: "^[0-9]{6}$" }
        confirmation: { type: string, minLength: 6, maxLength: 80 }
      required: [status, securityCode, confirmation]
    AdminWithdrawalDetailsInput:
      type: object
      properties:
        securityCode: { type: string, pattern: "^[0-9]{6}$" }
        confirmation: { type: string, minLength: 6, maxLength: 80 }
      required: [securityCode, confirmation]
    SupplierProductInput:
      type: object
      properties:
        sourceUrl: { type: string, format: uri, maxLength: 2000 }
      required: [sourceUrl]
    SupplierProductRecord:
      type: object
      properties:
        id: { type: integer }
        sourceUrl: { type: string, format: uri }
        sourceDomain: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"], format: uri }
        price: { type: ["number", "null"] }
        currency: { type: string }
        status: { type: string }
        importedAt: { type: string, format: date-time }
      required: [id, sourceUrl, sourceDomain, title, description, imageUrl, price, currency, status, importedAt]