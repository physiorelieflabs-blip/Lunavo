openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TS Commerce merchant and master-admin operations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Merchant dashboard operations
  - name: billing
    description: Merchant subscription billing
  - name: admin
    description: Master admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get merchant dashboard overview
      responses:
        "200":
          description: Merchant overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /settings/currency:
    get:
      operationId: getCurrencySettings
      tags: [settings]
      summary: Get the merchant settlement currency
      responses:
        "200":
          description: Currency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySettings"
    put:
      operationId: updateCurrencySettings
      tags: [settings]
      summary: Change the merchant settlement currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencySettingsInput"
      responses:
        "200":
          description: Updated currency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySettings"
  /dashboard/activity:
    get:
      operationId: listDashboardActivity
      tags: [dashboard]
      summary: List recent merchant activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /customers:
    get:
      operationId: listCustomers
      tags: [dashboard]
      summary: List the merchant's customers
      responses:
        "200":
          description: Customer records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerRecord"
  /orders:
    get:
      operationId: listOrders
      tags: [dashboard]
      summary: List the merchant's recorded orders
      responses:
        "200":
          description: Order records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderRecord"
    post:
      operationId: createOrder
      tags: [dashboard]
      summary: Record a merchant sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Recorded order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRecord"
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [dashboard]
      summary: Confirm or cancel a recorded customer order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRecord"
  /security/withdrawal:
    get:
      operationId: getWithdrawalSecurity
      tags: [withdrawals]
      summary: Get withdrawal security setup status
      responses:
        "200":
          description: Withdrawal security status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /security/withdrawal/setup:
    post:
      operationId: beginWithdrawalSecuritySetup
      tags: [withdrawals]
      summary: Begin authenticator setup for withdrawals
      responses:
        "201":
          description: Authenticator setup details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSetup"
  /security/withdrawal/confirm:
    post:
      operationId: confirmWithdrawalSecuritySetup
      tags: [withdrawals]
      summary: Confirm authenticator setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: Withdrawal security enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List the merchant's withdrawal requests
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WithdrawalRecord"
    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Request a withdrawal from available earnings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRecord"
  /bank-account:
    get:
      operationId: getLinkedBankAccount
      tags: [withdrawals]
      summary: Get the merchant's linked withdrawal bank account
      responses:
        "200":
          description: Linked bank account, if configured
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LinkedBankAccount"
                  - type: "null"
    put:
      operationId: saveLinkedBankAccount
      tags: [withdrawals]
      summary: Create or replace the merchant's linked withdrawal bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountInput"
      responses:
        "200":
          description: Linked bank account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedBankAccount"
    delete:
      operationId: deleteLinkedBankAccount
      tags: [withdrawals]
      summary: Remove the merchant's linked withdrawal bank account
      responses:
        "204":
          description: Bank account removed
  /supplier-products:
    get:
      operationId: listSupplierProducts
      tags: [suppliers]
      summary: List products imported from public supplier pages
      responses:
        "200":
          description: Imported products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierProductRecord"
    post:
      operationId: importSupplierProduct
      tags: [suppliers]
      summary: Save a reviewed product imported from a public supplier URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierProductInput"
      responses:
        "201":
          description: Imported product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /supplier-products/analyze:
    post:
      operationId: analyzeSupplierProduct
      tags: [suppliers]
      summary: Analyze a public supplier URL without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierAnalyzeInput"
      responses:
        "200":
          description: Extracted product preview and duplicate candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierAnalyzeResponse"
  /supplier-products/batch:
    post:
      operationId: importSupplierProductBatch
      tags: [suppliers]
      summary: Analyze and save multiple public supplier URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBatchInput"
      responses:
        "200":
          description: Per-URL batch results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierBatchResponse"
  /supplier-products/manual:
    post:
      operationId: createManualSupplierProduct
      tags: [suppliers]
      summary: Create a product manually when automatic extraction is unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualSupplierProductInput"
      responses:
        "201":
          description: Manually created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /supplier-products/{id}/refresh:
    post:
      operationId: refreshSupplierProduct
      tags: [suppliers]
      summary: Refresh a product source and return a reviewable diff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Source refresh diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierRefreshResponse"
  /supplier-products/{id}/refresh/accept:
    post:
      operationId: acceptSupplierRefresh
      tags: [suppliers]
      summary: Accept selected source refresh fields
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierRefreshAcceptInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List supplier records
      responses:
        "200":
          description: Supplier records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierRecord"
  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier notes and contact details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdateInput"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierRecord"
  /dropship/queue:
    get:
      operationId: listDropshipQueue
      tags: [dropshipping]
      summary: List product-linked orders waiting for supplier fulfillment
      responses:
        "200":
          description: Internal dropshipping fulfillment queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DropshipQueueRecord"
  /dropship/queue/{id}:
    patch:
      operationId: updateDropshipStatus
      tags: [dropshipping]
      summary: Update the internal supplier fulfillment status for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DropshipStatusInput"
      responses:
        "200":
          description: Updated dropshipping queue item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropshipQueueRecord"
  /public/store/{merchantKey}:
    get:
      operationId: getPublicStore
      tags: [checkout]
      summary: View a merchant's public catalog
      parameters:
        - name: merchantKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Public catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStore"
  /public/store/{merchantKey}/checkout:
    post:
      operationId: createPublicCheckout
      tags: [checkout]
      summary: Create a pending customer order from a public catalog
      parameters:
        - name: merchantKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutInput"
      responses:
        "201":
          description: Pending order awaiting merchant payment confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCheckoutOrder"
  /subscription:
    get:
      operationId: getSubscription
      tags: [billing]
      summary: Get current merchant subscription
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [billing]
      summary: Create or activate a merchant subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /subscription/bank-transfer:
    post:
      operationId: submitBankTransfer
      tags: [billing]
      summary: Submit a bank transfer reference for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankTransferInput"
      responses:
        "201":
          description: Transfer submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
  /subscription/use-earnings:
    post:
      operationId: paySubscriptionFromEarnings
      tags: [billing]
      summary: Apply merchant earnings to the subscription fee
      responses:
        "201":
          description: Earnings applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get master admin platform overview
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/merchants:
    get:
      operationId: listMerchants
      tags: [admin]
      summary: List merchants for the master admin
      responses:
        "200":
          description: Merchant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Merchant"
  /admin/merchants/{id}/status:
    patch:
      operationId: updateMerchantStatus
      tags: [admin]
      summary: Update merchant access status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantStatusInput"
      responses:
        "200":
          description: Updated merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
  /admin/payments/{id}/review:
    patch:
      operationId: reviewBankTransfer
      tags: [admin]
      summary: Approve or reject a submitted bank transfer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentReviewInput"
      responses:
        "200":
          description: Reviewed payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
  /admin/withdrawals:
    get:
      operationId: listAdminWithdrawals
      tags: [admin]
      summary: List withdrawal requests for the master admin
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWithdrawalRecord"
  /admin/withdrawals/{id}/review:
    patch:
      operationId: reviewWithdrawal
      tags: [admin]
      summary: Review or mark a withdrawal request as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWithdrawalReviewInput"
      responses:
        "200":
          description: Reviewed withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawalRecord"
  /admin/withdrawals/{id}/details:
    post:
      operationId: revealWithdrawalDetails
      tags: [admin]
      summary: Reveal a withdrawal destination after admin step-up verification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWithdrawalDetailsInput"
      responses:
        "200":
          description: Secure transfer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalDetails"
components:
  schemas:
    CurrencySettings:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        availableCurrencies:
          type: array
          items: { type: string }
      required: [currency, availableCurrencies]
    CurrencySettingsInput:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
      required: [currency]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ActivityItem:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        amount: { type: ["number", "null"] }
        currency: { type: string }
        occurredAt: { type: string, format: date-time }
        tone: { type: string }
      required: [id, type, title, description, amount, currency, occurredAt, tone]
    CustomerRecord:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        orderCount: { type: integer }
        totalSpent: { type: number }
        createdAt: { type: string, format: date-time }
      required: [id, name, email, phone, orderCount, totalSpent, createdAt]
    OrderRecord:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        customerName: { type: string }
        customerEmail: { type: string, format: email }
        total: { type: number }
        quantity: { type: integer, minimum: 1 }
        currency: { type: string }
        status: { type: string }
        supplierProductId: { type: ["integer", "null"] }
        productTitle: { type: ["string", "null"] }
        shippingAddress: { type: ["string", "null"] }
        fulfillmentStatus: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, orderNumber, customerName, customerEmail, total, quantity, currency, status, supplierProductId, productTitle, shippingAddress, fulfillmentStatus, createdAt]
    CreateOrderInput:
      type: object
      properties:
        customerName: { type: string, minLength: 2, maxLength: 160 }
        customerEmail: { type: string, format: email }
        customerPhone: { type: string, maxLength: 40 }
        total: { type: number, exclusiveMinimum: 0 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        status:
          type: string
          enum: [pending, paid, fulfilled]
        orderNumber: { type: string, minLength: 2, maxLength: 80 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
        supplierProductId: { type: integer, minimum: 1 }
        shippingAddress: { type: string, maxLength: 500 }
      required: [customerName, customerEmail, total]
    OrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [paid, cancelled]
      required: [status]
    Subscription:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        isAdmin: { type: boolean }
        amountDue: { type: number }
        amountPaid: { type: number }
        earningsHeld: { type: number }
        status: { type: string }
        registeredAt: { type: string, format: date-time }
        warningDay: { type: integer }
        suspensionDay: { type: integer }
        nextAction: { type: string }
        paymentMethod: { type: ["string", "null"] }
      required:
        - id
        - email
        - isAdmin
        - amountDue
        - amountPaid
        - earningsHeld
        - status
        - registeredAt
        - warningDay
        - suspensionDay
        - nextAction
        - paymentMethod
    DashboardOverview:
      type: object
      properties:
        currency: { type: string }
        storeName: { type: string }
        storeSlug: { type: string }
        revenue: { type: number }
        revenueChange: { type: number }
        orders: { type: integer }
        customers: { type: integer }
        availableBalance: { type: number }
        pendingBalance: { type: number }
        withdrawalReserved: { type: number }
        earningsHeldForSubscription: { type: number }
        subscription: { $ref: "#/components/schemas/Subscription" }
        revenueSeries:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePoint"
      required:
        - currency
        - storeName
        - storeSlug
        - revenue
        - revenueChange
        - orders
        - customers
        - availableBalance
        - pendingBalance
         - withdrawalReserved
        - earningsHeldForSubscription
        - subscription
        - revenueSeries
    RevenuePoint:
      type: object
      properties:
        label: { type: string }
        amount: { type: number }
      required: [label, amount]
    Merchant:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        storeName: { type: string }
        status: { type: string }
        subscriptionStatus: { type: string }
        amountPaid: { type: number }
        amountDue: { type: number }
        earningsHeld: { type: number }
        registeredAt: { type: string, format: date-time }
        daysSinceRegistration: { type: integer }
      required:
        - id
        - name
        - email
        - storeName
        - status
        - subscriptionStatus
        - amountPaid
        - amountDue
        - earningsHeld
        - registeredAt
        - daysSinceRegistration
    AdminOverview:
      type: object
      properties:
        platformRevenue: { type: number }
        subscriptionRevenue: { type: number }
        heldMerchantRevenue: { type: number }
        activeMerchants: { type: integer }
        attentionRequired: { type: integer }
        suspendedAccounts: { type: integer }
        recentPayments:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRecord"
      required:
        - platformRevenue
        - subscriptionRevenue
        - heldMerchantRevenue
        - activeMerchants
        - attentionRequired
        - suspendedAccounts
        - recentPayments
    PaymentRecord:
      type: object
      properties:
        id: { type: integer }
        merchantName: { type: string }
        amount: { type: number }
        currency: { type: string }
        method: { type: string }
        reference: { type: string }
        senderName: { type: ["string", "null"] }
        status: { type: string }
        reviewNote: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, merchantName, amount, currency, method, reference, senderName, status, reviewNote, reviewedAt, createdAt]
    SubscriptionInput:
      type: object
      properties:
        method:
          type: string
          enum: [earnings, bank]
      required: [method]
    BankTransferInput:
      type: object
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        reference: { type: string, minLength: 3 }
        senderName: { type: string, minLength: 2 }
      required: [amount, reference, senderName]
    MerchantStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended, banned]
      required: [status]
    PaymentReviewInput:
      type: object
      properties:
        status:
          type: string
          enum: [confirmed, rejected]
        note:
          type: string
          maxLength: 500
      required: [status]
    WithdrawalSecurity:
      type: object
      properties:
        enabled: { type: boolean }
        pendingSetup: { type: boolean }
      required: [enabled, pendingSetup]
    WithdrawalSetup:
      type: object
      properties:
        secret: { type: string }
        otpAuthUri: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [secret, otpAuthUri, expiresAt]
    TotpCodeInput:
      type: object
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
      required: [code]
    WithdrawalInput:
      type: object
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        totpCode: { type: string, pattern: "^[0-9]{6}$" }
