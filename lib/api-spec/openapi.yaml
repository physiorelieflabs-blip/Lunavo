openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TS Commerce Plattform merchant and master-admin operations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Merchant dashboard operations
  - name: billing
    description: Merchant subscription billing
  - name: admin
    description: Master admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get merchant dashboard overview
      responses:
        "200":
          description: Merchant overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /settings/currency:
    get:
      operationId: getCurrencySettings
      tags: [settings]
      summary: Get the merchant settlement currency
      responses:
        "200":
          description: Currency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySettings"
    put:
      operationId: updateCurrencySettings
      tags: [settings]
      summary: Change the merchant settlement currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencySettingsInput"
      responses:
        "200":
          description: Updated currency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySettings"
  /settings/checkout:
    get:
      operationId: getCheckoutSettings
      tags: [settings]
      summary: Get merchant tax and shipping rules
      responses:
        "200":
          description: Checkout pricing rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSettings"
    put:
      operationId: updateCheckoutSettings
      tags: [settings]
      summary: Update merchant tax and shipping rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSettingsInput"
      responses:
        "200":
          description: Updated checkout pricing rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSettings"
  /settings/fx:
    get:
      operationId: getMarketExchangeRate
      tags: [settings]
      summary: Get a market-sourced exchange rate
      parameters:
        - name: base
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: quote
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: Current market exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketExchangeRate"
  /store:
    post:
      operationId: createStore
      tags: [dashboard]
      summary: Create or update the authenticated merchant store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Persisted merchant store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
  /dashboard/activity:
    get:
      operationId: listDashboardActivity
      tags: [dashboard]
      summary: List recent merchant activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /ai/overview:
    get:
      operationId: getAiOverview
      tags: [ai]
      summary: Get first-party AI business intelligence
      responses:
        "200":
          description: Tenant-scoped AI overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiOverview"
  /ai/simulate:
    post:
      operationId: simulateAiScenario
      tags: [ai]
      summary: Simulate a business scenario with uncertainty labels
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSimulationInput" }
      responses:
        "200":
          description: Scenario estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSimulation" }
  /ai/train:
    post:
      operationId: trainAiModel
      tags: [ai]
      summary: Train the local commerce signals model
      responses:
        "201":
          description: Local model training result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModel"
  /ai/settings:
    get:
      operationId: getAiSettings
      tags: [ai]
      summary: Get AI autonomy and training settings
      responses:
        "200":
          description: AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
    put:
      operationId: updateAiSettings
      tags: [ai]
      summary: Update AI autonomy and training settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingsInput"
      responses:
        "200":
          description: Updated AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
  /ai/actions:
    get:
      operationId: listAiActions
      tags: [ai]
      summary: List AI actions and approvals
      responses:
        "200":
          description: Tenant-scoped AI action history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiAction"
    post:
      operationId: createAiAction
      tags: [ai]
      summary: Send an AI recommendation to the approval center
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiActionInput"
      responses:
        "201":
          description: AI action awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /ai/actions/{id}/approve:
    patch:
      operationId: approveAiAction
      tags: [ai]
      summary: Approve a reversible AI action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved AI action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /ai/actions/{id}/reject:
    patch:
      operationId: rejectAiAction
      tags: [ai]
      summary: Reject an AI action before execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected AI action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /ai/actions/{id}/execute:
    post:
      operationId: executeAiAction
      tags: [ai]
      summary: Execute an approved, reversible AI preparation action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Executed AI action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /ai/actions/{id}/rollback:
    post:
      operationId: rollbackAiAction
      tags: [ai]
      summary: Roll back an executed AI preparation action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rolled back AI action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
  /marketing/billing:
    get:
      operationId: getMarketingBilling
      tags: [marketing]
      summary: Get advertising payment history and available merchant earnings
      responses:
        "200":
          description: Advertising billing workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingBilling" }
  /marketing/campaigns/{id}/pay-earnings:
    post:
      operationId: payAdvertisingFromEarnings
      tags: [marketing, billing]
      summary: Pay an approved advertising budget from available merchant earnings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Advertising payment confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvertisingPayment" }
  /marketing/campaigns/{id}/payment-reference:
    post:
      operationId: submitAdvertisingPaymentReference
      tags: [marketing, billing]
      summary: Submit a manual advertising payment reference for admin review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvertisingPaymentReferenceInput" }
      responses:
        "201":
          description: Advertising payment reference awaiting review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvertisingPayment" }
  /admin/marketing/payments:
    get:
      operationId: listAdminAdvertisingPayments
      tags: [admin, marketing]
      summary: List advertising payment references awaiting admin review
      security:
        - clerkBearer: []
      responses:
        "200":
          description: Advertising payment review queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminAdvertisingPayment" }
  /admin/marketing/payments/{id}/review:
    patch:
      operationId: reviewAdvertisingPayment
      tags: [admin, marketing]
      summary: Verify or reject a manual advertising payment reference
      security:
        - clerkBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvertisingPaymentReview" }
      responses:
        "200":
          description: Reviewed advertising payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvertisingPayment" }
  /ai/research:
    post:
      operationId: researchWeb
      tags: [ai]
      summary: Perform a read-only, source-attributed web research pass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebResearchInput"
      responses:
        "200":
          description: Web research results with source attribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebResearchResponse"
  /customers:
    get:
      operationId: listCustomers
      tags: [dashboard]
      summary: List the merchant's customers
      responses:
        "200":
          description: Customer records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerRecord"
  /customers/{id}:
    patch:
      operationId: updateCustomer
      tags: [dashboard]
      summary: Update a merchant customer profile note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerRecord"
  /customers/{id}/context:
    get:
      operationId: getCustomerContext
      tags: [dashboard]
      summary: Get the tenant-wide connected customer record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Authoritative customer record and related commerce records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerContext" }
  /orders:
    get:
      operationId: listOrders
      tags: [dashboard]
      summary: List the merchant's recorded orders
      responses:
        "200":
          description: Order records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderRecord"
    post:
      operationId: createOrder
      tags: [dashboard]
      summary: Record a merchant sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Recorded order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRecord"
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [dashboard]
      summary: Confirm or cancel a recorded customer order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRecord"
  /orders/{id}/context:
    get:
      operationId: getOrderContext
      tags: [dashboard]
      summary: Get the location-scoped connected order record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Authoritative order record and related commerce records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderContext" }
  /payment-links:
    get:
      operationId: listPaymentLinks
      tags: [payments]
      summary: List the merchant's payment links
      responses:
        "200":
          description: Payment links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentLinkRecord" }
    post:
      operationId: createPaymentLink
      tags: [payments]
      summary: Create a fixed-price payment link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLinkInput" }
      responses:
        "201":
          description: Created payment link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLinkRecord" }
  /payment-links/{id}:
    patch:
      operationId: updatePaymentLink
      tags: [payments]
      summary: Archive or reactivate a payment link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLinkStatusInput" }
      responses:
        "200":
          description: Updated payment link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLinkRecord" }
  /security/withdrawal:
    get:
      operationId: getWithdrawalSecurity
      tags: [withdrawals]
      summary: Get withdrawal security setup status
      responses:
        "200":
          description: Withdrawal security status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /security/withdrawal/setup:
    post:
      operationId: beginWithdrawalSecuritySetup
      tags: [withdrawals]
      summary: Begin authenticator setup for withdrawals
      responses:
        "201":
          description: Authenticator setup details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSetup"
  /security/withdrawal/confirm:
    post:
      operationId: confirmWithdrawalSecuritySetup
      tags: [withdrawals]
      summary: Confirm authenticator setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: Withdrawal security enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /security/withdrawal/pins:
    post:
      operationId: setWithdrawalPins
      tags: [withdrawals]
      summary: Configure the required merchant or admin withdrawal PIN set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalPinsInput"
      responses:
        "200":
          description: Withdrawal PIN security status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalSecurity"
  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List the merchant's withdrawal requests
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WithdrawalRecord"
    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Request a withdrawal from available earnings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRecord"
  /bank-account:
    get:
      operationId: getLinkedBankAccount
      tags: [withdrawals]
      summary: Get the merchant's linked withdrawal bank account
      responses:
        "200":
          description: Linked bank account, if configured
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LinkedBankAccount"
                  - type: "null"
    put:
      operationId: saveLinkedBankAccount
      tags: [withdrawals]
      summary: Create or replace the merchant's linked withdrawal bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountInput"
      responses:
        "200":
          description: Linked bank account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedBankAccount"
    delete:
      operationId: deleteLinkedBankAccount
      tags: [withdrawals]
      summary: Remove the merchant's linked withdrawal bank account
      responses:
        "204":
          description: Bank account removed
  /supplier-products:
    get:
      operationId: listSupplierProducts
      tags: [suppliers]
      summary: List products imported from public supplier pages
      responses:
        "200":
          description: Imported products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierProductRecord"
    post:
      operationId: importSupplierProduct
      tags: [suppliers]
      summary: Save a reviewed product imported from a public supplier URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierProductInput"
      responses:
        "201":
          description: Imported product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /supplier-products/analyze:
    post:
      operationId: analyzeSupplierProduct
      tags: [suppliers]
      summary: Analyze a public supplier URL without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierAnalyzeInput"
      responses:
        "200":
          description: Extracted product preview and duplicate candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierAnalyzeResponse"
  /supplier-products/batch:
    post:
      operationId: importSupplierProductBatch
      tags: [suppliers]
      summary: Analyze and save multiple public supplier URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierBatchInput"
      responses:
        "200":
          description: Per-URL batch results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierBatchResponse"
  /supplier-import-history:
    get:
      operationId: listSupplierImportHistory
      tags: [suppliers]
      summary: List supplier import attempts and refresh history
      responses:
        "200":
          description: Supplier import history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierImportAttempt"
  /supplier-products/manual:
    post:
      operationId: createManualSupplierProduct
      tags: [suppliers]
      summary: Create a product manually when automatic extraction is unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualSupplierProductInput"
      responses:
        "201":
          description: Manually created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /supplier-products/{id}:
    patch:
      operationId: updateSupplierProduct
      tags: [suppliers]
      summary: Edit an imported supplier product before or after publishing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierProductUpdateInput"
      responses:
        "200":
          description: Updated supplier product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /supplier-products/{id}/refresh:
    post:
      operationId: refreshSupplierProduct
      tags: [suppliers]
      summary: Refresh a product source and return a reviewable diff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Source refresh diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierRefreshResponse"
  /supplier-products/{id}/refresh/accept:
    post:
      operationId: acceptSupplierRefresh
      tags: [suppliers]
      summary: Accept selected source refresh fields
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierRefreshAcceptInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierProductRecord"
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List supplier records
      responses:
        "200":
          description: Supplier records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierRecord"
  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier notes and contact details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdateInput"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierRecord"
  /dropship/queue:
    get:
      operationId: listDropshipQueue
      tags: [dropshipping]
      summary: List product-linked orders waiting for supplier fulfillment
      responses:
        "200":
          description: Internal dropshipping fulfillment queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DropshipQueueRecord"
  /dropship/queue/{id}:
    patch:
      operationId: updateDropshipStatus
      tags: [dropshipping]
      summary: Update the internal supplier fulfillment status for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DropshipStatusInput"
      responses:
        "200":
          description: Updated dropshipping queue item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropshipQueueRecord"
    post:
      operationId: createSupplierPayment
      tags: [dropshipping, payments]
      summary: Record an internal supplier payment from verified merchant funds
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierPaymentInput"
      responses:
        "201":
          description: Supplier payment recorded in the internal ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierPaymentRecord"
  /public/store/{merchantKey}:
    get:
      operationId: getPublicStore
      tags: [checkout]
      summary: View a merchant's public catalog
      parameters:
        - name: merchantKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Public catalog
          content:
